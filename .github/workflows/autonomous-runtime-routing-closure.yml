name: autonomous-runtime-routing-closure
on:
  push:
    branches:
      - docs/runtime-routing-closure-20260917
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close runtime routing after owner split
        shell: bash
        run: |
          set -euo pipefail
          BASE=2dacdfc991d5cb445a2ca1b57a5772d5823cc5bf
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git hash-object CHAT_INIT.md)" = f1a8dfcb6aac9ee184e11dc4f223c9b4a9d2adcd
          test "$(git hash-object CAPABILITY_INDEX.md)" = 342e5ed137c878507d04c33494f40a951680900c
          test "$(git hash-object PLAYBOOK_INDEX.json)" = 2c7a7ed5a42d09fe2ff1bffbf0fba27124e18ed8
          test "$(git hash-object CHATGPT_WORKFLOW.md)" = 51aa89cf44e388c435c2f2492b0cb12f2e65a26f
          test "$(git hash-object CHATGPT_RUNTIME_EXECUTION.md)" = 28eb1bf413faf74e9f3a96aa481d165ff09bec57
          test "$(git hash-object DEBUG_VALIDATION.md)" = 12d0fd3886ac7b55a14c3d6155371f1a8e0e96e6
          python - <<'PY'
          from pathlib import Path
          repls = {
          'CHAT_INIT.md': [
          ('候選成立再讀 `CHATGPT_WORKFLOW.md` → `ChatGPT-side Runtime Execution`。','候選成立再讀 `CHATGPT_RUNTIME_EXECUTION.md`。'),
          ('→ `CHATGPT_WORKFLOW.md` → `ChatGPT-side Runtime Execution`','→ `CHATGPT_RUNTIME_EXECUTION.md`'),
          ],
          'CAPABILITY_INDEX.md': [
          ('| ChatGPT bounded ephemeral execution | `CHATGPT_WORKFLOW.md` → `ChatGPT-side Runtime Execution` |','| ChatGPT bounded ephemeral execution | `CHATGPT_RUNTIME_EXECUTION.md` |'),
          ],
          'CHATGPT_WORKFLOW.md': [
          ('需要 runtime/tool時仍依 `ChatGPT-side Runtime Execution` 的 capability gate；','需要 runtime/tool時仍依 `CHATGPT_RUNTIME_EXECUTION.md` → `Execution Capability Gate`；'),
          ],
          'DEBUG_VALIDATION.md': [
          ('ChatGPT-side execution 的 runtime/toolchain capability、canonical snapshot與 session-specific discipline由 `CHATGPT_WORKFLOW.md` 的 `ChatGPT-side Runtime Execution` 負責；','ChatGPT-side execution 的 runtime/toolchain capability、canonical snapshot與 session-specific discipline由 `CHATGPT_RUNTIME_EXECUTION.md` 負責；'),
          ],
          'CHATGPT_RUNTIME_EXECUTION.md': [
          ('本檔由 `CHATGPT_WORKFLOW.md` 路由；不重新定義 repository mutation / permission、validation semantics 或 Codex execution policy。','本檔是 ChatGPT-side deterministic execution 的 direct-leaf owner；`CHATGPT_WORKFLOW.md` 保留 compatibility routing stub。它不重新定義 repository mutation / permission、validation semantics 或 Codex execution policy。'),
          ],
          }
          for name,pairs in repls.items():
              p=Path(name); s=p.read_text(encoding='utf-8')
              for old,new in pairs:
                  assert s.count(old)==1, (name, old, s.count(old))
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8',newline='\n')
          p=Path('PLAYBOOK_INDEX.json'); s=p.read_text(encoding='utf-8')
          marker='"id": "execution.chatgpt-runtime"'
          i=s.index(marker)
          owner_old='"owner": "CHATGPT_WORKFLOW.md"'
          owner_new='"owner": "CHATGPT_RUNTIME_EXECUTION.md"'
          j=s.index(owner_old,i)
          assert s.find('"id":', i+len(marker), j) == -1
          s=s[:j]+owner_new+s[j+len(owner_old):]
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          test "$(git hash-object CHAT_INIT.md)" = 548f40a7a09216a0cdc013c1c5feb175bc5e4208
          test "$(git hash-object CAPABILITY_INDEX.md)" = e28c5c2315802ca8667301eac9f77cef245e7250
          test "$(git hash-object PLAYBOOK_INDEX.json)" = aaa0399b43e88dc9194715bb2945263285449a86
          test "$(git hash-object CHATGPT_WORKFLOW.md)" = ac5e4379ae25fbc9400ab6a9ce6d2bcee0031b4d
          test "$(git hash-object CHATGPT_RUNTIME_EXECUTION.md)" = 94fe05c7189a86207312129b6fa8e117c1a02339
          test "$(git hash-object DEBUG_VALIDATION.md)" = e71e1bb77f5f2ec1debc8b875e7307f1bd8a7ae6
          ! grep -RIn --exclude-dir=.git -E '`CHATGPT_WORKFLOW\.md` → `ChatGPT-side Runtime Execution`|`CHATGPT_WORKFLOW\.md` 的 `ChatGPT-side Runtime Execution`|依 `ChatGPT-side Runtime Execution` 的 capability gate' .
          python tools/playbook_check.py
          python -m unittest discover -s tests -q
          git rm .github/workflows/autonomous-runtime-routing-closure.yml
          git add CHAT_INIT.md CAPABILITY_INDEX.md PLAYBOOK_INDEX.json CHATGPT_WORKFLOW.md CHATGPT_RUNTIME_EXECUTION.md DEBUG_VALIDATION.md
          test "$(git diff --cached --name-only "$BASE" | sort | tr '\n' ' ')" = "CAPABILITY_INDEX.md CHATGPT_RUNTIME_EXECUTION.md CHATGPT_WORKFLOW.md CHAT_INIT.md DEBUG_VALIDATION.md PLAYBOOK_INDEX.json "
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Close runtime execution routing after owner split"
          git push origin HEAD:docs/runtime-routing-closure-20260917
