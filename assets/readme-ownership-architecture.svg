<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <title>Shared and project-local ownership architecture / Shared 與專案本地權責架構</title>
  <desc>Cross-project methodology belongs in the AI Development Playbook, while project-specific governance, technical truth, stricter overrides, coordination, and domain rules stay with adopter repositories. / 跨專案共通方法論由 AI Development Playbook 擁有；專案治理、技術事實、較嚴限制、協調與 domain 規則留在 adopter repository。</desc>
  <defs>
    <style>
      .bg{fill:#fbfdff}.title{font:700 46px "Noto Sans CJK TC",Arial,sans-serif;fill:#0f2a5f}
      .subtitle{font:700 25px "Noto Sans CJK TC",Arial,sans-serif;fill:#1976d2}
      .boxTitle{font:700 23px "Noto Sans CJK TC",Arial,sans-serif;fill:#102a56}
      .body{font:18px "Noto Sans CJK TC",Arial,sans-serif;fill:#17345d}
      .small{font:16px "Noto Sans CJK TC",Arial,sans-serif;fill:#294b74}
      .tiny{font:15px "Noto Sans CJK TC",Arial,sans-serif;fill:#526b8c}
      .rule{font:700 18px "Noto Sans CJK TC",Arial,sans-serif;fill:#20466f}
      .arrow{fill:none;stroke:#355a89;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .arrowG{fill:none;stroke:#0b8f63;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#355a89"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0b8f63"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="940"/>
  <text x="800" y="58" class="title" text-anchor="middle">Ownership Architecture / 權責分層</text>
  <text x="800" y="95" class="subtitle" text-anchor="middle">Move shared methodology upward; keep project truth local.</text>

  <rect x="150" y="130" width="1300" height="220" rx="24" fill="#edf5ff" stroke="#2f8de4" stroke-width="2"/>
  <text x="800" y="174" class="boxTitle" text-anchor="middle">AI Development Playbook — shared cross-project methodology</text>
  <text x="800" y="204" class="small" text-anchor="middle">跨專案共通方法論與治理責任</text>

  <rect x="200" y="235" width="220" height="78" rx="14" fill="#ffffff" stroke="#8ab7e8"/>
  <text x="310" y="266" class="rule" text-anchor="middle">Context / routing</text>
  <text x="310" y="292" class="small" text-anchor="middle">Action Contract Closure</text>

  <rect x="455" y="235" width="220" height="78" rx="14" fill="#ffffff" stroke="#8ab7e8"/>
  <text x="565" y="266" class="rule" text-anchor="middle">Repository execution</text>
  <text x="565" y="292" class="small" text-anchor="middle">GitHub / permission</text>

  <rect x="710" y="235" width="220" height="78" rx="14" fill="#ffffff" stroke="#8ab7e8"/>
  <text x="820" y="266" class="rule" text-anchor="middle">Validation</text>
  <text x="820" y="292" class="small" text-anchor="middle">evidence / completion</text>

  <rect x="965" y="235" width="220" height="78" rx="14" fill="#ffffff" stroke="#8ab7e8"/>
  <text x="1075" y="266" class="rule" text-anchor="middle">Actor semantics</text>
  <text x="1075" y="292" class="small" text-anchor="middle">mode / delegation</text>

  <rect x="1220" y="235" width="180" height="78" rx="14" fill="#ffffff" stroke="#8ab7e8"/>
  <text x="1310" y="266" class="rule" text-anchor="middle">Hot / Cold</text>
  <text x="1310" y="292" class="small" text-anchor="middle">information lifecycle</text>

  <rect x="530" y="390" width="540" height="92" rx="20" fill="#f4efff" stroke="#7859e6" stroke-width="2"/>
  <text x="800" y="424" class="boxTitle" text-anchor="middle">Project-native activation gate / 專案原生啟用判斷</text>
  <text x="800" y="454" class="body" text-anchor="middle">Adoption ≠ unconditional activation</text>
  <path d="M800 350 V390" class="arrow" marker-end="url(#arrow)"/>

  <rect x="150" y="525" width="1300" height="220" rx="24" fill="#eefbf5" stroke="#16a66d" stroke-width="2"/>
  <text x="800" y="569" class="boxTitle" text-anchor="middle">Adopter repository — project-specific authority stays local</text>
  <text x="800" y="599" class="small" text-anchor="middle">實際專案仍擁有自己的治理、技術事實與較嚴限制</text>

  <rect x="205" y="632" width="235" height="78" rx="14" fill="#ffffff" stroke="#7dcaa9"/>
  <text x="323" y="663" class="rule" text-anchor="middle">Project governance</text>
  <text x="323" y="689" class="small" text-anchor="middle">baseline / AI mode / mapping</text>

  <rect x="475" y="632" width="235" height="78" rx="14" fill="#ffffff" stroke="#7dcaa9"/>
  <text x="592" y="663" class="rule" text-anchor="middle">Technical truth</text>
  <text x="592" y="689" class="small" text-anchor="middle">architecture / protocol / product</text>

  <rect x="745" y="632" width="235" height="78" rx="14" fill="#ffffff" stroke="#7dcaa9"/>
  <text x="862" y="663" class="rule" text-anchor="middle">Stricter overrides</text>
  <text x="862" y="689" class="small" text-anchor="middle">safety / privacy / secrets</text>

  <rect x="1015" y="632" width="235" height="78" rx="14" fill="#ffffff" stroke="#7dcaa9"/>
  <text x="1132" y="663" class="rule" text-anchor="middle">Local coordination</text>
  <text x="1132" y="689" class="small" text-anchor="middle">Hot / Cold / task surfaces</text>

  <rect x="1285" y="632" width="115" height="78" rx="14" fill="#ffffff" stroke="#7dcaa9"/>
  <text x="1342" y="662" class="rule" text-anchor="middle">Domain</text>
  <text x="1342" y="689" class="small" text-anchor="middle">validation</text>

  <path d="M800 482 V525" class="arrowG" marker-end="url(#arrowG)"/>

  <rect x="330" y="790" width="940" height="82" rx="18" fill="#fff8e9" stroke="#e5a31b" stroke-width="2"/>
  <text x="800" y="823" class="boxTitle" text-anchor="middle">Domain / canonical owners / runtime / evidence surfaces</text>
  <text x="800" y="851" class="small" text-anchor="middle">共通 invariant 可再上移；真正 mode / domain 差異留在自己的 owner</text>
  <path d="M800 745 V790" class="arrow" marker-end="url(#arrow)"/>

  <text x="800" y="910" class="tiny" text-anchor="middle">Illustrative architecture only. Canonical rules remain in project governance and routed owners.</text>
  <text x="800" y="932" class="tiny" text-anchor="middle">本圖只說明 responsibility architecture；正式規則仍以各 project governance 與 routed canonical owner 為準。</text>
</svg>