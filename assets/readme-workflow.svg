<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <style>
      .bg{fill:#fbfdff}.title{font:700 46px "Noto Sans CJK TC",Arial,sans-serif;fill:#0f2a5f}.subtitle{font:700 26px "Noto Sans CJK TC",Arial,sans-serif;fill:#1976d2}.lead{font:22px "Noto Sans CJK TC",Arial,sans-serif;fill:#16325c}.boxTitle{font:700 21px "Noto Sans CJK TC",Arial,sans-serif;fill:#102a56}.body{font:18px "Noto Sans CJK TC",Arial,sans-serif;fill:#17345d}.small{font:16px "Noto Sans CJK TC",Arial,sans-serif;fill:#26466f}.tiny{font:15px "Noto Sans CJK TC",Arial,sans-serif;fill:#526b8c}.rule{font:700 17px "Noto Sans CJK TC",Arial,sans-serif;fill:#20466f}.num{font:700 25px "Noto Sans CJK TC",Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}.arrow{fill:none;stroke:#355a89;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.arrowG{fill:none;stroke:#0b8f63;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.arrowR{fill:none;stroke:#d94d68;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#355a89"/></marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b8f63"/></marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d94d68"/></marker>
  </defs>

  <rect class="bg" width="1600" height="1080"/>
  <text x="800" y="58" class="title" text-anchor="middle">AI Development Playbook — Quick Workflow</text>
  <text x="800" y="96" class="subtitle" text-anchor="middle">Current human-facing flow / 目前人類閱讀版流程</text>
  <rect x="190" y="118" width="1220" height="68" rx="18" fill="#e8f3ff"/>
  <text x="800" y="147" class="lead" text-anchor="middle">Activate shared governance only when the project route says it is needed.</text>
  <text x="800" y="174" class="lead" text-anchor="middle">只有 project route 判定需要時，才啟用 shared Playbook governance。</text>

  <rect x="70" y="225" width="310" height="145" rx="18" fill="#eef7ff" stroke="#2f8de4" stroke-width="2"/>
  <circle cx="112" cy="266" r="27" fill="#2185df"/><text x="112" y="266" class="num">1</text>
  <text x="155" y="260" class="boxTitle">Project identity / bootstrap</text>
  <text x="155" y="289" class="small">確認專案身分與目前 bootstrap</text>
  <text x="95" y="332" class="small">Current project governance stays higher authority.</text>
  <text x="95" y="356" class="small">專案自己的 governance 仍較高權威。</text>

  <rect x="475" y="225" width="360" height="145" rx="18" fill="#f3efff" stroke="#7859e6" stroke-width="2"/>
  <circle cx="517" cy="266" r="27" fill="#6a53d8"/><text x="517" y="266" class="num">2</text>
  <text x="560" y="260" class="boxTitle">Activation gate</text>
  <text x="560" y="289" class="small">是否需要 shared Playbook governance？</text>
  <text x="500" y="332" class="small">Use project-native classifier only when explicitly declared.</text>
  <text x="500" y="356" class="small">只有明確宣告的 gate 才能判定。</text>

  <rect x="920" y="215" width="290" height="165" rx="18" fill="#ebfbf3" stroke="#16a66d" stroke-width="2"/>
  <text x="1065" y="252" class="boxTitle" text-anchor="middle">NO / 不需要</text>
  <text x="1065" y="290" class="body" text-anchor="middle">Stay project-native</text>
  <text x="1065" y="318" class="body" text-anchor="middle">留在低成本 hot path</text>
  <text x="1065" y="350" class="small" text-anchor="middle">Do not load Playbook for ceremony.</text>

  <rect x="1245" y="215" width="290" height="165" rx="18" fill="#fff6e7" stroke="#e5a31b" stroke-width="2"/>
  <text x="1390" y="252" class="boxTitle" text-anchor="middle">YES / 需要</text>
  <text x="1390" y="288" class="body" text-anchor="middle">Resolve adoption state</text>
  <text x="1390" y="316" class="body" text-anchor="middle">baseline + AI mode</text>
  <text x="1390" y="348" class="small" text-anchor="middle">floating ref → exact revision when needed</text>

  <path d="M380 298 H475" class="arrow" marker-end="url(#arrow)"/>
  <path d="M835 270 H920" class="arrowG" marker-end="url(#arrowG)"/>
  <path d="M835 326 V400 H1390 V380" class="arrowR" marker-end="url(#arrowR)"/>
  <text x="872" y="252" class="small" fill="#087c55">NO</text>
  <text x="1160" y="392" class="small" fill="#c2435d">YES</text>

  <rect x="1040" y="430" width="350" height="150" rx="18" fill="#eef7ff" stroke="#2f8de4" stroke-width="2"/>
  <circle cx="1083" cy="471" r="27" fill="#2185df"/><text x="1083" y="471" class="num">3</text>
  <text x="1126" y="465" class="boxTitle">Playbook CHAT_INIT</text>
  <text x="1126" y="494" class="small">activation 後才進 shared router</text>
  <text x="1068" y="538" class="small">Load only minimum-sufficient canonical owner(s).</text>
  <text x="1068" y="562" class="small">只讀本題最低充分 canonical owner。</text>
  <path d="M1390 380 V405 H1215 V430" class="arrow" marker-end="url(#arrow)"/>

  <rect x="475" y="625" width="650" height="145" rx="18" fill="#f6f9fd" stroke="#8ab7e8" stroke-width="2"/>
  <circle cx="518" cy="666" r="27" fill="#5aa7e8"/><text x="518" y="666" class="num">4</text>
  <text x="560" y="660" class="boxTitle">Current task / authority / evidence</text>
  <text x="560" y="689" class="small">確認目前 task、scope、evidence、permission 與 repository truth</text>
  <text x="500" y="733" class="small">Choose the lowest-sufficient authorized actor; execute or hand off only inside current authority.</text>
  <text x="500" y="757" class="small">選最低充分且已授權 actor，只在 current authority 內執行／交接。</text>

  <path d="M1065 380 V400 H900 V625" class="arrowG" marker-end="url(#arrowG)"/>
  <path d="M1215 580 V600 H800 V625" class="arrow" marker-end="url(#arrow)"/>

  <rect x="540" y="820" width="520" height="125" rx="18" fill="#eaf4ff" stroke="#2b85dc" stroke-width="2"/>
  <circle cx="583" cy="861" r="27" fill="#2185df"/><text x="583" y="861" class="num">5</text>
  <text x="626" y="855" class="boxTitle">Canonical read-back / reconciliation</text>
  <text x="626" y="884" class="small">回讀 current state、核對 evidence</text>
  <text x="626" y="916" class="small">→ Done / next Stage / handoff / STOP</text>
  <path d="M800 770 V820" class="arrow" marker-end="url(#arrow)"/>

  <rect x="65" y="430" width="780" height="150" rx="18" fill="#fff" stroke="#c9d9ea" stroke-width="2"/>
  <text x="95" y="468" class="boxTitle">Stable invariants / 穩定不變的判斷</text>
  <text x="105" y="508" class="rule">Adoption ≠ activation</text>
  <text x="365" y="508" class="rule">Capability ≠ authority</text>
  <text x="625" y="508" class="rule">PASS ≠ done</text>
  <text x="105" y="548" class="rule">Historical memory ≠ current authority</text>
  <text x="465" y="548" class="rule">Persistence ≠ default loading</text>

  <text x="800" y="1006" class="tiny" text-anchor="middle">Illustrative workflow only; canonical rules remain in the linked owner documents.</text>
  <text x="800" y="1032" class="tiny" text-anchor="middle">本圖只提供人類閱讀的穩定流程概覽；正式規則仍以對應 canonical owner 為準。</text>
</svg>
